    <rect x="452" y="90" width="112" height="20" rx="6" fill="#bb9af7" fill-opacity=".08" stroke="#bb9af7" stroke-opacity=".45"/>
    <rect x="462" y="98" width="60" height="4" rx="2" fill="#bb9af7" fill-opacity=".7"/>
    <circle cx="550" cy="100" r="4.5" fill="#565f89"><animate attributeName="fill" values="#565f89;#565f89;#9ece6a;#9ece6a" keyTimes="0;.2;.3;1" dur="6s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="44" cy="55" r="4.5" fill="#bb9af7"/>
