    <radialGradient id="glow" cx="88%" cy="18%" r="60%">
      <stop offset="0" stop-color="#bb9af7" stop-opacity=".26"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="600" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
