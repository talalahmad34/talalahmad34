<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="IT Requisition App - Requests and approvals for IT, meeting rooms and leave, with a portal for each role.">
  <defs>
