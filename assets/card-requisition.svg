    <rect x="452" y="64" width="112" height="20" rx="6" fill="#bb9af7" fill-opacity=".08" stroke="#bb9af7" stroke-opacity=".45"/>
    <rect x="462" y="72" width="40" height="4" rx="2" fill="#bb9af7" fill-opacity=".7"/>
