    <text x="38" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-.8" fill="#ffffff">IT Requisition App</text>
    <text font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#a9b1d6">
      <tspan x="40" y="164">Requests and approvals for IT, meeting rooms</tspan>
      <tspan x="40" y="190">and leave, with a portal for each role.</tspan>
    </text>
    <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="14" text-anchor="middle" fill="#c0caf5">
      <g fill="#bb9af7" fill-opacity=".10" stroke="#bb9af7" stroke-opacity=".42"><rect x="40" y="232" width="76" height="30" rx="15"/><rect x="126" y="232" width="68" height="30" rx="15"/><rect x="204" y="232" width="76" height="30" rx="15"/></g>
      <text x="78" y="251.9">Python</text><text x="160" y="251.9">Flask</text><text x="242" y="251.9">SQLite</text>
