<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Frostpane - A calm, frosted-glass new tab page for Chromium browsers. Live clock, search, twelve bookmarks.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/><stop offset=".6" stop-color="#101937"/><stop offset="1" stop-color="#0b1124"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="18%" r="60%">
      <stop offset="0" stop-color="#7dcfff" stop-opacity=".26"/><stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="600" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <rect width="600" height="300" fill="url(#glow)"/>
    
    <rect x="452" y="34" width="112" height="78" rx="14" fill="#7dcfff" fill-opacity=".10" stroke="#7dcfff" stroke-opacity=".55" stroke-width="1.5"/>
    <rect x="482" y="48" width="22" height="5" rx="2.5" fill="#7dcfff"/>
    <rect x="512" y="48" width="22" height="5" rx="2.5" fill="#7dcfff"/>
    <g fill="#7dcfff"><circle cx="508" cy="47" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle><circle cx="508" cy="54" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle></g>
    <rect x="470" y="62" width="76" height="8" rx="4" fill="none" stroke="#7dcfff" stroke-opacity=".6"/>
    <g fill="#7dcfff" fill-opacity=".55">
      <rect x="466" y="78" width="12" height="12" rx="3.5"/><rect x="483" y="78" width="12" height="12" rx="3.5"/><rect x="500" y="78" width="12" height="12" rx="3.5"><animate attributeName="fill-opacity" values=".55;1;.55" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="517" y="78" width="12" height="12" rx="3.5"/><rect x="534" y="78" width="12" height="12" rx="3.5"/>
      <rect x="466" y="94" width="12" height="12" rx="3.5"/><rect x="483" y="94" width="12" height="12" rx="3.5"/><rect x="500" y="94" width="12" height="12" rx="3.5"/>
      <rect x="517" y="94" width="12" height="12" rx="3.5"><animate attributeName="fill-opacity" values=".55;1;.55" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect><rect x="534" y="94" width="12" height="12" rx="3.5"/>
    </g>
    <circle cx="44" cy="55" r="4.5" fill="#7dcfff"/>
    <text x="58" y="60" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2" fill="#7dcfff">BROWSER EXTENSION</text>
    <text x="38" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-.8" fill="#ffffff">Frostpane</text>
    <text font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#a9b1d6">
      <tspan x="40" y="164">A calm, frosted-glass new tab page for Chromium</tspan>
      <tspan x="40" y="190">browsers. Live clock, search, twelve bookmarks.</tspan>
    </text>
    <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="14" text-anchor="middle" fill="#c0caf5">
      <g fill="#7dcfff" fill-opacity=".10" stroke="#7dcfff" stroke-opacity=".42"><rect x="40" y="232" width="111" height="30" rx="15"/><rect x="161" y="232" width="51" height="30" rx="15"/><rect x="222" y="232" width="119" height="30" rx="15"/><rect x="351" y="232" width="102" height="30" rx="15"/></g>
      <text x="95.5" y="251.9">JavaScript</text><text x="186.5" y="251.9">CSS</text><text x="281.5" y="251.9">Manifest V3</text><text x="402" y="251.9">Zero deps</text>
    </g>
    <text x="560" y="254" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="22" fill="#7dcfff">→<animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="2.4s" repeatCount="indefinite"/></text>
  </g>
  <rect x=".75" y=".75" width="598.5" height="298.5" rx="19.5" fill="none" stroke="#7dcfff" stroke-opacity=".32" stroke-width="1.5"/>
</svg>
