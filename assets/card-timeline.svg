      <tspan x="40" y="164">Project tracking on a colour-coded timeline,</tspan>
      <tspan x="40" y="190">built to replace spreadsheet status reports.</tspan>
    </text>
    <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="14" text-anchor="middle" fill="#c0caf5">
      <g fill="#ff9e64" fill-opacity=".10" stroke="#ff9e64" stroke-opacity=".42"><rect x="40" y="232" width="76" height="30" rx="15"/><rect x="126" y="232" width="68" height="30" rx="15"/><rect x="204" y="232" width="111" height="30" rx="15"/><rect x="325" y="232" width="76" height="30" rx="15"/></g>
      <text x="78" y="251.9">Python</text><text x="160" y="251.9">Flask</text><text x="259.5" y="251.9">SQLAlchemy</text><text x="363" y="251.9">SQLite</text>
    </g>
    <text x="560" y="254" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="22" fill="#ff9e64">→<animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="2.4s" repeatCount="indefinite"/></text>
