<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Projects Timeline - Project tracking on a colour-coded timeline, built to replace spreadsheet status reports.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/><stop offset=".6" stop-color="#101937"/><stop offset="1" stop-color="#0b1124"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="18%" r="60%">
      <stop offset="0" stop-color="#ff9e64" stop-opacity=".26"/><stop offset="1" stop-color="#ff9e64" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="600" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <rect width="600" height="300" fill="url(#glow)"/>
    
    <path d="M452 110 H564" stroke="#ff9e64" stroke-opacity=".45"/>
